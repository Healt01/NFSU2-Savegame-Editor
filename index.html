<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NFSU2 Save Editor (Offline)</title>
  <meta name="description" content="Offline save editor for Need for Speed: Underground 2 (PC, original Xbox/xemu, Switch port nfsu2-sw). Fork by Healt01 of hackch/NFSU2-Savegame-Editor (MIT): adds the Xbox save signature (HMAC-SHA1) so edited saves load, plus money, profile name and car performance. Runs entirely in your browser." />
  <meta property="og:title" content="NFSU2 Save Editor (Offline) — fork by Healt01" />
  <meta property="og:description" content="Fork by Healt01 of hackch/NFSU2-Savegame-Editor (MIT). Adds the Xbox save signature (HMAC-SHA1) so edited saves load, plus the car performance fields. Runs offline; original editor by Christopher Hack." />
  <style>
    :root {
      --bg: #0f1220;
      --panel: #171a2b;
      --muted: #98a2b3;
      --text: #e5e7eb;
      --accent: #60a5fa;
    }

    html,
    body {
      height: 100%
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Inter, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .wrap {
      max-width: 900px;
      margin: 0 auto;
      padding: 24px;
    }

    h1 {
      font-size: clamp(20px, 3vw, 28px);
      margin: 0 0 8px
    }

    .sub {
      color: var(--muted);
      margin-bottom: 16px
    }

    a {
      color: var(--accent);
    }

    .legal {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
      margin-top: 20px;
      border-top: 1px solid #262b40;
      padding-top: 12px
    }

    .card {
      background: var(--panel);
      border: 1px solid #22263e;
      border-radius: 16px;
      padding: 16px;
      margin: 12px 0;
      box-shadow: 0 4px 24px rgba(0, 0, 0, .25)
    }

    .row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap
    }

    .langbar {
      display: flex;
      gap: 8px;
      margin-bottom: 12px
    }

    .langbar button[aria-pressed="true"] {
      border-color: var(--accent);
      color: var(--accent)
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px
    }

    input[type="file"],
    input[type="number"],
    input[type="text"],
    select,
    button {
      background: #0e1224;
      border: 1px solid #252b45;
      color: var(--text);
      border-radius: 10px;
      padding: 10px 12px
    }

    input[type="number"],
    input[type="text"],
    select {
      width: 100%
    }

    button {
      cursor: pointer
    }

    button.primary {
      background: linear-gradient(180deg, #2563eb, #1d4ed8);
      border: 0
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px
    }

    .muted {
      color: var(--muted)
    }

    .pill {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 999px;
      background: #0b1022;
      font-size: 12px
    }

    .warn {
      color: #fbbf24
    }

    .ok {
      color: #34d399
    }

    details {
      border: 1px dashed #2a3053;
      border-radius: 12px;
      padding: 10px
    }

    code {
      background: #0b1022;
      border: 1px solid #2a3053;
      padding: 2px 6px;
      border-radius: 6px
    }

    .footer {
      margin-top: 18px;
      font-size: 12px;
      color: var(--muted)
    }

    .noscript {
      border: 1px solid #fbbf24;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 14px;
      font-size: 13px;
      line-height: 1.6
    }
  </style>
</head>

<body>
  <div class="wrap">
    <noscript>
      <div class="noscript">
        <strong>This page needs JavaScript.</strong> The save file is read, edited and
        rebuilt inside your browser; nothing is uploaded. Original editor by
        <a href="https://github.com/hackch/NFSU2-Savegame-Editor">hackch /
          NFSU2-Savegame-Editor</a> (MIT), Christopher Hack &copy; 2025; this fork's
        changes are Healt &copy; 2026, same MIT license &mdash; keep the notice with any
        copy. Tested in game on a modded Switch running the port and in xemu; not tested
        on an original Xbox console. Signing keys of consoles are not published.<br><br>
        <strong>Esta p&aacute;gina precisa de JavaScript.</strong> O arquivo de save &eacute;
        lido, editado e reconstru&iacute;do dentro do seu navegador; nada &eacute; enviado.
        Editor original de <a
        href="https://github.com/hackch/NFSU2-Savegame-Editor">hackch /
          NFSU2-Savegame-Editor</a> (MIT), Christopher Hack &copy; 2025; as mudan&ccedil;as
        desta fork s&atilde;o Healt &copy; 2026, mesma licen&ccedil;a MIT &mdash; mantenha o
        aviso em qualquer c&oacute;pia. Testado no jogo em um Switch modificado rodando o
        port e no xemu; n&atilde;o testei em console Xbox original. Chaves de assinatura de
        console n&atilde;o s&atilde;o publicadas.
      </div>
    </noscript>
    <div class="langbar">
      <button id="langEn" type="button" aria-pressed="true">English</button>
      <button id="langPt" type="button" aria-pressed="false">Português (Brasil)</button>
    </div>

    <h1 data-i18n="title"></h1>
    <div class="sub" data-i18n="sub"></div>

    <div class="card">
      <div class="grid">
        <div>
          <label for="file" data-i18n="fileLabel"></label>
          <input id="file" type="file" accept="*/*" />
          <div class="muted" id="fileInfo"></div>
        </div>
        <div>
          <label>&nbsp;</label>
          <label class="muted"><input id="backupToggle" type="checkbox" checked /> <span
              data-i18n="backupLabel"></span></label>
          <div class="muted" id="backupHint"></div>
        </div>
      </div>
    </div>

    <div class="card" id="summary" hidden>
      <div class="grid" id="summaryDisplay">
        <div>
          <div class="muted" data-i18n="sumName"></div>
          <div id="profile" class="pill">—</div>
        </div>
        <div>
          <div class="muted" data-i18n="sumMoney"></div>
          <div id="moneyDisplay" class="pill">—</div>
        </div>
        <div>
          <div class="muted" data-i18n="sumSlots"></div>
          <div id="slots" class="pill">—</div>
        </div>
        <div>
          <div class="muted" data-i18n="sumHeader"></div>
          <div id="headerStatus" class="pill">—</div>
        </div>
        <div>
          <div class="muted" data-i18n="sumFormat"></div>
          <div id="formatDisplay" class="pill">—</div>
        </div>
        <div id="sourceCell" hidden>
          <div class="muted" data-i18n="sumSource"></div>
          <div id="sourceStatus" class="pill">—</div>
        </div>
        <div id="sigCell" hidden>
          <div class="muted" data-i18n="sumSig"></div>
          <div id="sigStatus" class="pill">—</div>
        </div>
      </div>
    </div>

    <div class="card" id="editor" hidden>
      <div class="grid">
        <div>
          <label for="name" data-i18n="nameLabel"></label>
          <input id="name" type="text" maxlength="32" />
          <div class="muted" id="nameHint"></div>
        </div>
        <div>
          <label for="money" data-i18n="moneyLabel"></label>
          <input id="money" type="number" step="1" />
        </div>
      </div>
      <div class="muted" id="xboxNote" hidden></div>
      <div id="xboxKeyRow" hidden>
        <div style="height:12px"></div>
        <label for="xboxKey" data-i18n="keyLabel"></label>
        <div class="row">
          <input id="xboxKey" type="text" spellcheck="false" autocomplete="off" style="flex:1; min-width:260px" />
          <button id="keyFillPort" type="button"></button>
          <button id="keyClear" type="button"></button>
        </div>
        <div class="muted" id="keyHint"></div>
      </div>
      <div id="keyHiddenRow" hidden>
        <div style="height:12px"></div>
        <div class="row">
          <button id="keyShow" type="button"></button>
        </div>
        <div class="muted" id="keyAutoNote"></div>
      </div>
      <div style="height:12px"></div>
      <div class="grid" id="cars"></div>
      <div class="muted" id="status"></div>
      <div style="height:12px"></div>
      <div class="row">
        <button id="apply" class="primary" disabled data-i18n="btnApply"></button>
        <button id="download" disabled data-i18n="btnDownload"></button>
        <button id="downloadBak" disabled data-i18n="btnBak"></button>
        <button id="reload" data-i18n="btnReset"></button>
      </div>
    </div>

    <footer class="legal">
      <div data-i18n-html="footOriginal"></div>
      <div data-i18n-html="footCopyright"></div>
      <div data-i18n-html="footScope"></div>
      <div data-i18n-html="footMade"></div>
    </footer>

    <script src="src/nfsu2saveeditor.js?v=2026-10-28a"></script>
</body>

</html>
